codecov:
  require_ci_to_pass: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: 90%
        informational: true

ignore:
  - "cmd/**/main.go"
  - "Dockerfile"

comment:
  layout: "reach,diff,flags,files,footer"
  require_changes: true
